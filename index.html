<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Festivite — Crie seu convite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Leckerli+One&family=Baloo+2:wght@500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style/index.css" />
  </head>
  <body>
    <div class="card">
      <!-- PAINEL ESQUERDO -->
      <aside class="left-panel" aria-label="Identidade Festivite">
        <header class="brand">
          <p class="logo-emoji" aria-hidden="true">🎉</p>
          <h1>Festivite</h1>
          <p class="tagline">Crie um convite digital para o seu evento</p>
        </header>

        <figure class="cover-art" aria-label="Imagem de capa do convite">
          <img
            src="assets/Background.png"
            alt="Ilustração do convite Festivite"
          />
        </figure>
      </aside>

      <!-- PAINEL DIREITO -->
      <main class="right-panel">
        <form id="invite-form" novalidate>
          <h2 class="page-title">Crie seu convite</h2>

          <!-- SOBRE O EVENTO -->
          <fieldset class="section">
            <legend class="section-head">
              <img src="assets/icons/calendar.svg" alt="" />
              Sobre o evento
            </legend>

            <div class="field">
              <label for="titulo">Título</label>
              <input
                id="titulo"
                name="titulo"
                type="text"
                placeholder="Nome do evento"
                required
              />
              <span class="error-msg" id="titulo-error" hidden>
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="12" cy="12" r="10" />
                  <path d="M12 8v5M12 16h.01" />
                </svg>
                Campo obrigatório
              </span>
            </div>

            <div class="row">
              <div class="field">
                <label for="inicio">Início</label>
                <input id="inicio" name="inicio" type="datetime-local" />
              </div>
              <div class="field">
                <label for="fim">Fim</label>
                <input id="fim" name="fim" type="datetime-local" />
              </div>
            </div>

            <div class="row">
              <div class="field">
                <span class="field-label" id="tipo-label">Tipo</span>
                <div
                  class="segmented"
                  role="group"
                  aria-labelledby="tipo-label"
                >
                  <input
                    class="visually-hidden seg-radio"
                    type="radio"
                    id="tipo-presencial"
                    name="tipo"
                    value="presencial"
                    checked
                  />
                  <label class="seg-btn" for="tipo-presencial">
                    <img src="assets/icons/building.svg" alt="" />
                    Presencial
                  </label>
                  <input
                    class="visually-hidden seg-radio"
                    type="radio"
                    id="tipo-online"
                    name="tipo"
                    value="online"
                  />
                  <label class="seg-btn" for="tipo-online">
                    <img src="assets/icons/video.svg" alt="" />
                    Online
                  </label>
                </div>
              </div>
              <div class="field">
                <label for="local">Local</label>
                <input
                  id="local"
                  name="local"
                  type="text"
                  placeholder="Link ou endereço"
                />
              </div>
            </div>

            <div class="field">
              <label for="descricao">Descrição</label>
              <textarea
                id="descricao"
                name="descricao"
                placeholder="Escreva sobre os detalhes do evento"
              ></textarea>
            </div>
          </fieldset>

          <!-- PERSONALIZAÇÃO -->
          <fieldset class="section">
            <legend class="section-head">
              <img src="assets/icons/paintbrush-vertical.svg" alt="" />
              Personalização
            </legend>

            <div class="field">
              <span class="field-label" id="cor-label">Cor principal</span>
              <div class="swatch-row" role="group" aria-labelledby="cor-label">
                <input
                  class="visually-hidden color-radio"
                  type="radio"
                  id="cor-1"
                  name="cor"
                  value="#59B2FF"
                />
                <label class="swatch swatch-1" for="cor-1"
                  ><span class="visually-hidden">Azul claro</span></label
                >

                <input
                  class="visually-hidden color-radio"
                  type="radio"
                  id="cor-2"
                  name="cor"
                  value="#6A59FF"
                />
                <label class="swatch swatch-2" for="cor-2"
                  ><span class="visually-hidden">Navy</span></label
                >

                <input
                  class="visually-hidden color-radio"
                  type="radio"
                  id="cor-3"
                  name="cor"
                  value="#B259FF"
                />
                <label class="swatch swatch-3" for="cor-3"
                  ><span class="visually-hidden">Roxo</span></label
                >

                <input
                  class="visually-hidden color-radio"
                  type="radio"
                  id="cor-4"
                  name="cor"
                  value="#FF59F9"
                />
                <label class="swatch swatch-4" for="cor-4"
                  ><span class="visually-hidden">Fúcsia</span></label
                >

                <input
                  class="visually-hidden color-radio"
                  type="radio"
                  id="cor-5"
                  name="cor"
                  value="#FF598B"
                  checked
                />
                <label class="swatch swatch-5" for="cor-5"
                  ><span class="visually-hidden">Rosa</span></label
                >

                <input
                  class="visually-hidden color-radio"
                  type="radio"
                  id="cor-6"
                  name="cor"
                  value="#FF5959"
                />
                <label class="swatch swatch-6" for="cor-6"
                  ><span class="visually-hidden">Vermelho</span></label
                >

                <input
                  class="visually-hidden color-radio"
                  type="radio"
                  id="cor-7"
                  name="cor"
                  value="#FF8B59"
                />
                <label class="swatch swatch-7" for="cor-7"
                  ><span class="visually-hidden">Laranja</span></label
                >

                <input
                  class="visually-hidden color-radio"
                  type="radio"
                  id="cor-8"
                  name="cor"
                  value="#FFCD59"
                />
                <label class="swatch swatch-8" for="cor-8"
                  ><span class="visually-hidden">Amarelo</span></label
                >

                <input
                  class="visually-hidden color-radio"
                  type="radio"
                  id="cor-9"
                  name="cor"
                  value="#E1FF59"
                />
                <label class="swatch swatch-9" for="cor-9"
                  ><span class="visually-hidden">Lima</span></label
                >

                <input
                  class="visually-hidden color-radio"
                  type="radio"
                  id="cor-10"
                  name="cor"
                  value="#59FF91"
                />
                <label class="swatch swatch-10" for="cor-10"
                  ><span class="visually-hidden">Verde</span></label
                >

                <input
                  class="visually-hidden color-radio"
                  type="radio"
                  id="cor-11"
                  name="cor"
                  value="#59FFF9"
                />
                <label class="swatch swatch-11" for="cor-11"
                  ><span class="visually-hidden">Ciano</span></label
                >
              </div>
            </div>

            <div class="field">
              <span class="field-label" id="tema-label">Tema do evento</span>
              <ul class="theme-grid" role="group" aria-labelledby="tema-label">
                <li>
                  <input
                    class="visually-hidden theme-radio"
                    type="radio"
                    id="tema-aniversario"
                    name="tema"
                    value="aniversario"
                    checked
                  />
                  <label class="theme-item" for="tema-aniversario">
                    <img class="theme-thumb" src="assets/Image-01.png" alt="" />
                    <span class="theme-name">Aniversário</span>
                  </label>
                </li>
                <li>
                  <input
                    class="visually-hidden theme-radio"
                    type="radio"
                    id="tema-infantil"
                    name="tema"
                    value="infantil"
                  />
                  <label class="theme-item" for="tema-infantil">
                    <img class="theme-thumb" src="assets/Image-02.png" alt="" />
                    <span class="theme-name">Infantil</span>
                  </label>
                </li>
                <li>
                  <input
                    class="visually-hidden theme-radio"
                    type="radio"
                    id="tema-formatura"
                    name="tema"
                    value="formatura"
                  />
                  <label class="theme-item" for="tema-formatura">
                    <img class="theme-thumb" src="assets/Image-03.png" alt="" />
                    <span class="theme-name">Formatura</span>
                  </label>
                </li>
                <li>
                  <input
                    class="visually-hidden theme-radio"
                    type="radio"
                    id="tema-casamento"
                    name="tema"
                    value="casamento"
                  />
                  <label class="theme-item" for="tema-casamento">
                    <img class="theme-thumb" src="assets/Image-04.png" alt="" />
                    <span class="theme-name">Casamento</span>
                  </label>
                </li>
                <li>
                  <input
                    class="visually-hidden theme-radio"
                    type="radio"
                    id="tema-cha-bebe"
                    name="tema"
                    value="cha-bebe"
                  />
                  <label class="theme-item" for="tema-cha-bebe">
                    <img class="theme-thumb" src="assets/Image-05.png" alt="" />
                    <span class="theme-name">Chá de bebê</span>
                  </label>
                </li>
                <li>
                  <input
                    class="visually-hidden theme-radio"
                    type="radio"
                    id="tema-cha-panela"
                    name="tema"
                    value="cha-panela"
                  />
                  <label class="theme-item" for="tema-cha-panela">
                    <img class="theme-thumb" src="assets/Image-06.png" alt="" />
                    <span class="theme-name">Chá de panela</span>
                  </label>
                </li>
                <li>
                  <input
                    class="visually-hidden theme-radio"
                    type="radio"
                    id="tema-carnaval"
                    name="tema"
                    value="carnaval"
                  />
                  <label class="theme-item" for="tema-carnaval">
                    <img class="theme-thumb" src="assets/Image-07.png" alt="" />
                    <span class="theme-name">Carnaval</span>
                  </label>
                </li>
                <li>
                  <input
                    class="visually-hidden theme-radio"
                    type="radio"
                    id="tema-pascoa"
                    name="tema"
                    value="pascoa"
                  />
                  <label class="theme-item" for="tema-pascoa">
                    <img class="theme-thumb" src="assets/Image-08.png" alt="" />
                    <span class="theme-name">Páscoa</span>
                  </label>
                </li>
                <li>
                  <input
                    class="visually-hidden theme-radio"
                    type="radio"
                    id="tema-sao-joao"
                    name="tema"
                    value="sao-joao"
                  />
                  <label class="theme-item" for="tema-sao-joao">
                    <img class="theme-thumb" src="assets/Image-09.png" alt="" />
                    <span class="theme-name">São João</span>
                  </label>
                </li>
                <li>
                  <input
                    class="visually-hidden theme-radio"
                    type="radio"
                    id="tema-halloween"
                    name="tema"
                    value="halloween"
                  />
                  <label class="theme-item" for="tema-halloween">
                    <img class="theme-thumb" src="assets/Image-10.png" alt="" />
                    <span class="theme-name">Halloween</span>
                  </label>
                </li>
                <li>
                  <input
                    class="visually-hidden theme-radio"
                    type="radio"
                    id="tema-natal"
                    name="tema"
                    value="natal"
                  />
                  <label class="theme-item" for="tema-natal">
                    <img class="theme-thumb" src="assets/Image-11.png" alt="" />
                    <span class="theme-name">Natal</span>
                  </label>
                </li>
                <li>
                  <input
                    class="visually-hidden theme-radio"
                    type="radio"
                    id="tema-outro"
                    name="tema"
                    value="outro"
                  />
                  <label class="theme-item" for="tema-outro">
                    <img class="theme-thumb" src="assets/Image-12.png" alt="" />
                    <span class="theme-name">Outro</span>
                  </label>
                </li>
              </ul>
            </div>

            <div class="custom-row">
              <div class="field">
                <label class="field-label" for="estilo-escuro">Estilo</label>
                <div class="switch-wrap">
                  <input
                    class="visually-hidden switch-checkbox"
                    type="checkbox"
                    id="estilo-escuro"
                    name="estilo-escuro"
                  />
                  <label class="switch" for="estilo-escuro"></label>
                  <span class="switch-label" id="switch-label-text"
                    >Escuro</span
                  >
                </div>
              </div>
              <div class="field">
                <label class="field-label" for="foto-capa">Foto de capa</label>
                <div class="file-input-row">
                  <label class="file-btn" for="foto-capa">
                    <img src="assets/icons/upload.svg" alt="" />
                    Selecionar
                  </label>
                  <input
                    class="visually-hidden"
                    type="file"
                    id="foto-capa"
                    name="foto-capa"
                    accept="image/*"
                  />
                  <span class="file-status" id="file-status"
                    >Nenhum arquivo selecionado</span
                  >
                </div>
              </div>
            </div>
          </fieldset>

          <!-- DADOS PARA CONTATO -->
          <fieldset class="section">
            <legend class="section-head">
              <img src="assets/icons/contact.svg" alt="" />
              Dados para contato
            </legend>

            <div class="field">
              <label for="nome">Nome</label>
              <input
                id="nome"
                name="nome"
                type="text"
                placeholder="Nome completo"
                required
              />
              <span class="error-msg" id="nome-error" hidden>
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="12" cy="12" r="10" />
                  <path d="M12 8v5M12 16h.01" />
                </svg>
                Campo obrigatório
              </span>
            </div>

            <div class="row no-margin">
              <div class="field">
                <label for="email">E-mail</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  placeholder="exemplo@email.com"
                />
              </div>
              <div class="field">
                <label for="telefone">Telefone</label>
                <input
                  id="telefone"
                  name="telefone"
                  type="tel"
                  placeholder="(99) 99999-9999"
                />
              </div>
            </div>
          </fieldset>

          <hr class="divider" />

          <fieldset class="check-list">
            <legend class="visually-hidden">Consentimentos</legend>
            <div class="check-row">
              <input
                class="checkbox"
                type="checkbox"
                id="termos"
                name="termos"
                required
              />
              <label for="termos"
                >Li e concordo com os <a href="#">Termos e Condições</a> e com a
                <a href="#">Política de Privacidade</a></label
              >
            </div>
            <div class="check-row">
              <input
                class="checkbox"
                type="checkbox"
                id="promo-email"
                name="promo-email"
              />
              <label for="promo-email"
                >Aceito receber atualizações e promoções por e-mail</label
              >
            </div>
            <div class="check-row">
              <input
                class="checkbox"
                type="checkbox"
                id="promo-sms"
                name="promo-sms"
              />
              <label for="promo-sms"
                >Aceito receber atualizações e promoções por SMS</label
              >
            </div>
          </fieldset>

          <div class="actions">
            <output
              class="form-status"
              id="form-status"
              for="titulo nome termos"
              hidden
            ></output>
            <button class="btn-primary" type="submit">
              <img src="assets/icons/ticket.svg" alt="" />
              Gerar convite
            </button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
